[project]
name = "jetlinks-acp-evals"
version = "0.1.0"
description = "ACP-native evaluation harness for coding agents and MCP-enabled agent runtimes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "JetLinks" }
]
keywords = ["acp", "agent", "evals", "mcp", "benchmark", "coding-agent"]
dependencies = [
  "click>=8.1.7",
  "pydantic>=2.7.0",
  "rich>=13.7.0",
  "websockets>=12.0",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/jetlinks/jetlinks-acp-evals"
Repository = "https://github.com/jetlinks/jetlinks-acp-evals"
Issues = "https://github.com/jetlinks/jetlinks-acp-evals/issues"

[project.scripts]
acp-evals = "acp_evals.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
